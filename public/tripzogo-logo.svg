<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 135" width="100%" height="100%">
  <defs>
    <linearGradient id="tzBrandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f36323" />
      <stop offset="22%" stop-color="#f05324" />
      <stop offset="48%" stop-color="#e5322d" />
      <stop offset="76%" stop-color="#ce1a38" />
      <stop offset="100%" stop-color="#9e1822" />
    </linearGradient>

    <linearGradient id="tzCompassRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea3829" />
      <stop offset="100%" stop-color="#bd1827" />
    </linearGradient>

    <linearGradient id="tzNeedleLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <linearGradient id="tzNeedleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>

    <filter id="tzDropShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1" flood-color="#7f1d1d" flood-opacity="0.22" />
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@500;600&amp;display=swap');
    .tz-word {
      font-family: 'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 900;
      font-size: 84px;
      fill: url(#tzBrandGradient);
      filter: url(#tzDropShadow);
    }
    .tz-tagline {
      font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 500;
      font-size: 21px;
      letter-spacing: 2.5px;
      fill: #73211a;
    }
  </style>

  <g transform="translate(6, 2)">
    <text x="0" y="80" class="tz-word" letter-spacing="-2px">tripz</text>

    <g transform="translate(257, 54)" filter="url(#tzDropShadow)">
      <circle cx="0" cy="0" r="30" fill="url(#tzCompassRingGrad)" />
      <circle cx="0" cy="0" r="21" fill="#ffffff" />
      <line x1="0" y1="-19" x2="0" y2="-14.5" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round" />
      <line x1="0" y1="19" x2="0" y2="14.5" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round" />
      <line x1="19" y1="0" x2="14.5" y2="0" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round" />
      <line x1="-19" y1="0" x2="-14.5" y2="0" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round" />
      <circle cx="8.5" cy="-15" r="1.1" fill="#991b1b" />
      <circle cx="15" cy="-8.5" r="1.1" fill="#991b1b" />
      <circle cx="15" cy="8.5" r="1.1" fill="#991b1b" />
      <circle cx="8.5" cy="15" r="1.1" fill="#991b1b" />
      <circle cx="-8.5" cy="15" r="1.1" fill="#991b1b" />
      <circle cx="-15" cy="8.5" r="1.1" fill="#991b1b" />
      <circle cx="-15" cy="-8.5" r="1.1" fill="#991b1b" />
      <circle cx="-8.5" cy="-15" r="1.1" fill="#991b1b" />
      <g transform="rotate(38)">
        <polygon points="0,-17 -4.2,-1 0,0" fill="url(#tzNeedleLight)" />
        <polygon points="0,-17 4.2,-1 0,0" fill="url(#tzNeedleDark)" />
        <polygon points="0,6.5 -3,0 0,0" fill="url(#tzNeedleDark)" />
        <polygon points="0,6.5 3,0 0,0" fill="url(#tzNeedleLight)" />
        <circle cx="0" cy="0" r="2.8" fill="#ffffff" stroke="#991b1b" stroke-width="1" />
        <circle cx="0" cy="0" r="1.2" fill="#7f1d1d" />
      </g>
    </g>

    <text x="294" y="80" class="tz-word" letter-spacing="-2px">go</text>

    <text x="210" y="118" text-anchor="middle" class="tz-tagline">travel smart. go easy.</text>
  </g>
</svg>
